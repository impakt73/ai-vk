# Run from the repository root with:
# cargo run -- run-graph examples/rasterization/triangle_rasterize.toml
#
# triangle.bin stores a little-endian uint triangle count followed by one
# record per triangle: three float2 positions in normalized [0, 1] screen
# space (origin at the top left) and one float4 color.

[arguments]
width = "128"
height = "128"
output = "triangle_rasterized.png"

[resources.triangles]
type = "buffer"
input = "triangle.bin"

[resources.output]
type = "image"
extent = ["$width", "$height"]
output = "$output"

[[nodes]]
name = "rasterize"
shader = "triangle_rasterize.hlsl"
kernel = "main"
dispatch = ["$div_align($width, 8)", "$div_align($height, 8)", 1]
bindings = [
    { resource = "triangles", access = "read" },
    { resource = "output", access = "write" },
]
