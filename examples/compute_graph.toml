# Run from the repository root with:
# cargo run -- run-graph examples/compute_graph.toml
# cargo run -- run-graph examples/compute_graph.toml --arg width=16 --arg height=16

[arguments]
width = "8"
height = "8"

[resources.source]
type = "image"
extent = ["$width", "$height"]

[resources.output]
type = "image"
extent = ["$width", "$height"]
output = "compute_graph_output.png"

[[nodes]]
name = "fill-source"
shader = "shaders/graph_fill.hlsl"
kernel = "main"
dispatch = [1, 1, 1]
bindings = [{ resource = "source", access = "write" }]

[[nodes]]
name = "copy-to-output"
shader = "shaders/graph_copy.hlsl"
kernel = "main"
dispatch = [1, 1, 1]
bindings = [
    { resource = "source", access = "read" },
    { resource = "output", access = "write" },
]
