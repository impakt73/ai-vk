# Run from the repository root with:
# cargo run -- run-graph graphs/upsampling/sdf_bilinear_upsample.toml
# cargo run -- run-graph graphs/upsampling/sdf_bilinear_upsample.toml \
#     --arg source_width=24 --arg source_height=16 \
#     --arg output_width=48 --arg output_height=32

[arguments]
source_width = "24"
source_height = "16"
output_width = "48"
output_height = "32"

[resources.source]
type = "image"
extent = ["$source_width", "$source_height"]

[resources.output]
type = "image"
extent = ["$output_width", "$output_height"]
output = "sdf_bilinear_upsampled.png"

[[nodes]]
name = "raymarch"
shader = "sdf_raymarch.hlsl"
kernel = "main"
dispatch = ["$div_align($source_width, 8)", "$div_align($source_height, 8)", 1]
bindings = [{ resource = "source", access = "write" }]

[[nodes]]
name = "bilinear-upsample"
shader = "bilinear_upsample.hlsl"
kernel = "main"
dispatch = ["$div_align($output_width, 8)", "$div_align($output_height, 8)", 1]
bindings = [
    { resource = "source", access = "read" },
    { resource = "output", access = "write" },
]
